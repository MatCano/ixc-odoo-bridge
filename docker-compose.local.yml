version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: maisfibra-postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5432:5432"

  odoo:
    image: odoo:19.0
    container_name: maisfibra-odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./odoo-addons:/mnt/maisfibra-addons:ro
      - ./data/whatsapp:/var/lib/odoo/whatsapp
      - odoo-web-data:/var/lib/odoo
    command: >
      odoo
      --addons-path=/mnt/extra-addons,/mnt/maisfibra-addons
      --db_host=db
      --db_port=5432
      --db_user=odoo
      --db_password=odoo
      -d maisfibra-crm
      --db-filter=^maisfibra-crm$$
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maisfibra-bridge
    depends_on:
      - odoo
    ports:
      - "8000:8000"
    environment:
      - ODOO_URL=http://odoo:8069
      - ODOO_DB=maisfibra-crm
      - ODOO_USER=admin
      - ODOO_PASSWORD=admin
      - MF_CAMPOS=1
      - SYNC_STATE_PATH=/app/data/ixc_sync_state.json
      - BRIDGE_TOKEN=teste-token-local
      - WEBHOOK_SECRET=teste-webhook-local
      - ALERTAS=0
      - POLL_INTERVAL_MINUTES=5
      - CADASTROS_INTERVAL_MINUTES=60
    volumes:
      - bridge-data:/app/data
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
  bridge-data:
